<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RFPC — Godzilla Leaderboard Embed Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #14110f; color: #efe6d2; font-family: "Inter", system-ui, sans-serif; overflow: hidden; }
  .stage { position: absolute; inset: 0; padding: 56px 88px 40px; box-sizing: border-box; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid #c8352b; padding-bottom: 18px; }
  h1 { margin: 0; font-size: 88px; font-weight: 800; letter-spacing: 2px; }
  .kicker { text-align: right; }
  .kicker b { display: block; font-size: 40px; letter-spacing: 3px; }
  .kicker span { font-size: 20px; letter-spacing: 8px; color: #d9a441; }
  .box { position: relative; flex: 1; margin-top: 36px; border: 1px solid #3a302a; border-bottom: 4px solid #c8352b; border-radius: 10px; overflow: hidden; background: #221d1a; }
  .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #8a7d6c; text-align: center; padding: 40px; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  footer { margin-top: 20px; font-size: 22px; color: #8a7d6c; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>GODZILLA</h1>
    <div class="kicker"><b>LEADERBOARD</b><span>STERN INSIDER · LIVE</span></div>
  </header>
  <div class="box">
    <div class="fallback">If this stays blank or shows "refused to connect",<br>Stern is blocking the embed.</div>
    <iframe src="https://sternlb.com/tlmk199" referrerpolicy="no-referrer-when-downgrade" allow="fullscreen"></iframe>
  </div>
  <footer>Embed test — RFPC kiosk</footer>
</div>
</body>
</html>
